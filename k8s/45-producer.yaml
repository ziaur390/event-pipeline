apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  namespace: pipeline
spec:
  replicas: 1
  selector:
    matchLabels: {app: producer}
  template:
    metadata:
      labels: {app: producer}
    spec:
      containers:
        - name: producer
          image: event-pipeline-producer:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: pipeline-config}
          resources:
            requests: {cpu: "50m", memory: "64Mi"}
            limits:   {cpu: "250m", memory: "256Mi"}
