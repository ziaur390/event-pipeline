apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: pipeline
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: event-pipeline-api:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: pipeline-config}
          ports:
            - {containerPort: 8000}
          livenessProbe:                 # cheap, no dependencies
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:                # checks dependencies
            httpGet: {path: /ready, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: pipeline
spec:
  selector: {app: api}
  ports:
    - {port: 8000, targetPort: 8000}
